name: M30 - Mobile CI

on:
  workflow_dispatch:
  push:
    branches:
      - ci

jobs:
  ios-browserstack:
    runs-on: ubuntu-latest

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Enviar app para o BrowserStack
        shell: bash
        run: |
          RESPONSE=$(curl -s \
            -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "url=https://raw.githubusercontent.com/EBAC-QE/ebac-store-mobile-tests/ios/app/LojaEBAC.ipa")

          echo "$RESPONSE"

          APP_URL=$(echo "$RESPONSE" | jq -r '.app_url')

          if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
            echo "Não foi possível obter o app_url do BrowserStack."
            exit 1
          fi

          echo "BROWSERSTACK_APP_ID=$APP_URL" >> "$GITHUB_ENV"

      - name: Executar testes iOS no BrowserStack
        run: npx wdio run ./config/wdio.browserstack.conf.js

      - name: Salvar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-mobile-ci
          path: artifacts/
          if-no-files-found: ignore
